onboarding = false

[theme.custom]
# The tab row's right-hand status entry (the WORK/PERSONAL/LOCAL tag configured
# under [ui] below) takes its foreground from overlay1. herdr's docs list the
# theme tokens but never say what any of them paint; this one was identified by
# setting it to an obvious color and looking at the result.
#
# Two caveats. overlay1 is a shared palette token rather than a tag-specific
# one, so this also repaints anything else herdr draws with it, and that blast
# radius has not been mapped. And like every theme key it is client-local, so
# it cannot vary by server: WORK, PERSONAL and LOCAL all render in this color.
overlay1 = "#00ff00"

# Keys chosen to MATCH ~/dotfiles/tmux/tmux.conf, so one set of Hammerspoon and
# Karabiner bindings drives either multiplexer. Hammerspoon cannot tell them
# apart (same terminal, same bundle id), so the configs have to agree instead.
#
# Pane focus (prefix+h/j/k/l), splits (prefix+v, prefix+minus), tabs
# (prefix+c/p/n), zoom (prefix+z), close pane (prefix+x) and the workspace
# picker (prefix+w, the same key tmux uses for choose-tree) already match tmux
# at herdr's defaults and are deliberately NOT overridden here.
[keys]
# tmux's prefix, not herdr's ctrl+b default.
prefix = "ctrl+a"

# Move between workspaces. herdr ships previous_workspace and next_workspace
# UNSET, so out of the box there is no key at all for this; the only ways to
# change workspace are the prefix+w picker and navigate mode's up/down arrows.
# These two bindings are the fix.
#
# shift+k / shift+j rather than something closer to tmux, because tmux has no
# workspace concept to match (sessions are the nearest thing and are switched
# with prefix+( and prefix+), which herdr cannot bind: its key parser takes
# only minus, comma, ampersand, plus and backtick as named punctuation).
# Vertical letters suit the sidebar, which lists workspaces top to bottom, and
# agree with navigate mode's own up/down for the same movement.
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"

# Karabiner's super-duper `n` sends C-a , which tmux uses to rename a window.
rename_tab = "prefix+comma"

# KNOWN DIVERGENCES, deliberately not fixed:
#
# `r`  Karabiner's super-duper `r` sends C-a r, which tmux binds to reloading
#      its config and herdr binds to resize mode. Remapping herdr's
#      reload_config onto prefix+r would collide with resize_mode, and resize
#      mode earns the key more often.
#
# `f`  Karabiner's super-duper `f` sends C-a f Return, which is tmux's
#      find-window. herdr has no equivalent, and `goto` (prefix+g) is
#      undocumented, so it is left alone rather than guessed at. C-a f simply
#      does nothing in herdr.

[ui]
status_indicators = "symbols"

# Marks a LOCAL herdr session, shown at the right of the tab row. The matching
# entries for the two remotes live ON THOSE SERVERS, in their own config.toml,
# not here. See docs/herdr.md.
#
# herdr reads tab_bar_right from the SERVER's config. The documented line, that
# hostname/datetime/command entries "resolve on the Herdr server", is a much
# narrower claim than it first reads as: it governs where a value is computed,
# not which config the entry list comes from. A list written here renders on
# local sessions only and is invisible under `herdr --remote`. Verified by
# attaching with an entry present here and absent there; the area was blank.
#
# Static text rather than a command, because this file only ever describes this
# machine. An earlier version ran a `case` over `$(hostname)` to name whichever
# remote it was attached to, which could never have worked for the reason above.
tab_bar_right = [
  { type = "text", text = "● LOCAL" },
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

# experimental.allow_nested is deliberately left at its default of false.
# It would let herdr launch from inside a herdr-managed pane, which sounds
# useful for `herdr --remote` but buys little: a fresh terminal window has no
# nesting to resolve, no doubled prefix key and no ambiguity about which
# session a keystroke reaches. Open a new window to ssh into a session.
