# Don't print a new line at the start of the prompt
add_newline = false
command_timeout = 500

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[aws]
disabled = true

[python]
symbol = "🐍 "
# Show version + venv name when active, e.g. 🐍 3.12.10 (mcp-servers)
# Parenthesized venv name only appears when a virtualenv is activated
format = 'via [$symbol$version( \($virtualenv\))]($style) '
style = "yellow bold"
# Only show this module when inside a Python project — avoids showing system
# Python everywhere. uv.lock added so uv projects are detected reliably.
detect_files = ["pyproject.toml", ".python-version", "uv.lock", "requirements.txt", "Pipfile"]
detect_folders = [".venv"]

[nodejs]
symbol = "⬢ "

[conda]
format = '[$symbol$environment](dimmed green) '
symbol = "🅒 "
