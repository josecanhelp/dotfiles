
# ARCHIVE. This file was generated by home-manager from nix/home/shared/tmux.nix
# and nix/home/darwin/tmux.nix until 2026-09-12, when herdr replaced tmux as the
# multiplexer and those modules were dropped from the import list. They are still
# in the repo, unreferenced, if you want the generated path back.
#
# tmux itself is still installed (nix/packages.nix, `shell` list), so this works
# with no rebuild:
#
#     tmux -f ~/dotfiles/tmux/tmux.conf
#
# Hand-maintained from here on. One deliberate change from the generated output:
# prefix+v now splits side by side to match herdr, and even-vertical moved to
# prefix+V. See the split section below.

set  -g default-terminal "tmux-256color"
set  -g base-index      0
setw -g pane-base-index 0
# We need to set default-shell before calling new-session
set  -g default-shell "/bin/zsh"





set -g status-keys vi
set -g mode-keys   vi

bind -N "Select pane to the left of the active pane" h select-pane -L
bind -N "Select pane below the active pane" j select-pane -D
bind -N "Select pane above the active pane" k select-pane -U
bind -N "Select pane to the right of the active pane" l select-pane -R

bind -r -N "Resize the pane left by 5" \
  H resize-pane -L 5
bind -r -N "Resize the pane down by 5" \
  J resize-pane -D 5
bind -r -N "Resize the pane up by 5" \
  K resize-pane -U 5
bind -r -N "Resize the pane right by 5" \
  L resize-pane -R 5


# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix




set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     4096

# ============================================= #
# Load plugins with Home Manager                #
# --------------------------------------------- #

# tmuxplugin-resurrect
# ---------------------

run-shell /nix/store/dlm9zyxkwzl8qppb965xzf4w53jn3py7-tmuxplugin-resurrect-unstable-2022-05-01/share/tmux-plugins/resurrect/resurrect.tmux


# tmuxplugin-continuum
# ---------------------

run-shell /nix/store/h6js51knnqn7gr1kg3fpwlw0fb74ycbg-tmuxplugin-continuum-unstable-2022-01-25/share/tmux-plugins/continuum/continuum.tmux


# tmuxplugin-copycat
# ---------------------

run-shell /nix/store/dllh1zlbi6xw631krvqvs8x7vkgwyiq8-tmuxplugin-copycat-unstable-2020-01-09/share/tmux-plugins/copycat/copycat.tmux


# tmuxplugin-yank
# ---------------------

run-shell /nix/store/zigwssigynx923a393h9m9da9p64za3m-tmuxplugin-yank-unstable-2023-07-19/share/tmux-plugins/yank/yank.tmux

# ============================================= #

# Plugin configurations
# Off deliberately. Continuum's own osx_enable.sh writes
# ~/Library/LaunchAgents/Tmux.Start.plist pointing at whatever directory
# the plugin happens to live in, which is why the old registration still
# pointed into ~/.tmux/plugins long after tpm was retired, failing with
# exit 1 at every login. The launchd.agents.tmux-boot block below
# declares the same thing against a store path instead.
#
# Setting this off is also what makes continuum run osx_disable.sh and
# delete its own stale plist, so it cleans up after itself.
set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set -ag terminal-features ",alacritty:RGB" # True color + italics in Alacritty
set -g renumber-windows on
set-option -g allow-rename off # Do not rename windows
set -g allow-passthrough on
set -s extended-keys on

bind s setw synchronize-panes # Synchonize panes
# bind m movew -r # Reorder Windows
# bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'" # Sane scrolling

bind c new-window -a # Create a new pane

# Reload tmux configuration with 'r'. Points at this archive, because nix no
# longer generates ~/.config/tmux/tmux.conf (see the header above).
unbind r
bind r source-file ~/dotfiles/tmux/tmux.conf\; display "Reloading Matrix..."

# Easier window splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix+v splits side by side, matching herdr's split_vertical default, so one
# Hammerspoon keystroke set drives both multiplexers. `bind |` above is kept as
# an alias for muscle memory. even-vertical moved off `v` to `V` below.
bind v split-window -h -c "#{pane_current_path}"

# Adjust Split Evenly
bind V select-layout even-vertical
bind o select-layout even-horizontal

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="children=(); i=0; pids=( $(ps -o pid= -t '#{pane_tty}') ); \
while read -r c p; do [[ -n c && c -ne p && p -ne 0 ]] && children[p]+=\" $\{c\}\"; done <<< \"$(ps -Ao pid=,ppid=)\"; \
while (( $\{#pids[@]\} > i )); do pid=$\{pids[i++]\}; pids+=( $\{children[pid]-\} ); done; \
ps -o state=,comm= -p \"$\{pids[@]\}\" | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-d' if-shell "$is_vim" "display-message 'In Vim'" "display-message 'Current Command: #{pane_current_command}'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

if-shell "test -f ~/dotfiles/tmux/tmuxline" "source ~/dotfiles/tmux/tmuxline"

# Fire macOS notification when any pane rings the bell (e.g. Claude Code)
set -g bell-action any
set -g visual-bell off
set-hook -g alert-bell 'run-shell "osascript -e \"display notification \\\"Claude requires your attention\\\" with title \\\"Claude Code\\\"\""'

# Clear the Claude attention marker (@claude_alert) the moment its window is
# focused. The marker itself is set by ~/.claude/notify.sh (Claude Code hooks).
set-hook -g session-window-changed 'set-option -w @claude_alert ""'
